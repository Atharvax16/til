[project]
name = "moviechat-memory-repro"
version = "0.1.0"
description = "Minimal reproduction of the MovieChat (arXiv:2307.16449) memory-efficiency claim"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "timm==1.0.11",
    "numpy==2.1.3",
    "matplotlib==3.9.2",
    "scikit-image==0.24.0",
    "psutil==6.1.0",
    "opencv-python==4.10.0.84",
    "ipykernel==6.29.5",
    "nbformat==5.10.4",
    "nbclient==0.10.0",
    "jupyterlab==4.3.4",
]

[tool.uv]
package = false
